<!DOCTYPE html>
<html>
<head>
  <title>Blackjack Multiplayer</title>
</head>
<body>
  <h1>Blackjack</h1>
  <p id="chips">Fichas: 1000</p>

  <input id="bet" type="number" placeholder="Apuesta">
  <button onclick="placeBet()">Apostar</button>
  <button onclick="startRound()">Iniciar ronda</button>
  <button onclick="hit()">Hit</button>
  <button onclick="stand()">Stand</button>
  <button onclick="double()">Double</button>

  <div id="game"></div>

  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Apostar
    function placeBet() {
      const amount = parseInt(document.getElementById("bet").value);
      socket.emit("placeBet", amount);
    }

    socket.on("betPlaced", (data) => {
      document.getElementById("chips").innerText = "Fichas: " + data.chips;
    });

    // Iniciar ronda
    function startRound() {
      socket.emit("startRound");
    }

    socket.on("roundStarted", (data) => {
      let gameDiv = document.getElementById("game");
      gameDiv.innerHTML = "";

      let dealerCard = data.dealer[0];
      gameDiv.innerHTML += "<h2>Dealer: " + dealerCard.value + dealerCard.suit + "</h2>";

      for (let id in data.players) {
        let hand = data.players[id];
        let cards = hand.map(c => c.value + c.suit).join(" ");
        gameDiv.innerHTML += "<p>Jugador " + id + ": " + cards + "</p>";
      }
    });

    // Hit
    function hit() {
      socket.emit("hit");
    }

    socket.on("cardDealt", (hand) => {
      document.getElementById("game").innerHTML += "<p>Nueva carta: " + hand.map(c => c.value + c.suit).join(" ") + "</p>";
    });

    // Stand
    function stand() {
      socket.emit("stand");
    }

    socket.on("playerStood", (hand) => {
      document.getElementById("game").innerHTML += "<p>Te plantaste con: " + hand.map(c => c.value + c.suit).join(" ") + "</p>";
    });

    // Double
    function double() {
      socket.emit("double");
    }

    socket.on("doubleDone", (data) => {
      document.getElementById("chips").innerText = "Fichas: " + data.chips;
      document.getElementById("game").innerHTML += "<p>Doblas apuesta. Mano: " + data.hand.map(c => c.value + c.suit).join(" ") + "</p>";
    });

    // Dealer termina
    socket.on("dealerFinished", (data) => {
      let cards = data.dealer.map(c => c.value + c.suit).join(" ");
      document.getElementById("game").innerHTML += "<h2>Dealer final: " + cards + " (Total: " + data.value + ")</h2>";
    });

    // Resultado de la ronda
    socket.on("roundResult", (data) => {
      let dealerCards = data.dealer.map(c => c.value + c.suit).join(" ");
      let playerCards = data.hand.map(c => c.value + c.suit).join(" ");

      document.getElementById("chips").innerText = "Fichas: " + data.chips;

      document.getElementById("game").innerHTML += `
        <h3>Resultado:</h3>
        <p>Tu mano: ${playerCards} (Total: ${data.value})</p>
        <p>Dealer: ${dealerCards} (Total: ${data.dealerValue})</p>
        <p><strong>${data.result}</strong></p>
      `;
    });
  </script>
</body>
</html>
