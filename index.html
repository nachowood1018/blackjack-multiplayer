<!DOCTYPE html>
<html>
<head>
  <title>Blackjack Multiplayer</title>
  <style>
    body {
      background-color: #0b3d0b;
      color: #fff;
      font-family: 'Arial', sans-serif;
      text-align: center;
    }

    h1 {
      color: gold;
      text-shadow: 2px 2px #000;
    }

    #chips {
      font-size: 20px;
      margin-bottom: 10px;
    }

    button {
      background-color: #222;
      color: gold;
      border: 2px solid gold;
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: gold;
      color: #222;
    }

    .card {
      display: inline-block;
      width: 60px;
      height: 90px;
      border: 1px solid #fff;
      border-radius: 8px;
      background-color: #fff;
      color: #000;
      margin: 5px;
      font-size: 20px;
      line-height: 90px;
      text-align: center;
      box-shadow: 2px 2px 5px #000;
    }

    .hearts, .diamonds {
      color: red;
    }

    .spades, .clubs {
      color: black;
    }

    #game {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Blackjack</h1>
  <p id="chips">Fichas: 1000</p>

  <input id="bet" type="number" placeholder="Apuesta">
  <button onclick="placeBet()">Apostar</button>
  <button onclick="startRound()">Iniciar ronda</button>
  <button onclick="hit()">Hit</button>
  <button onclick="stand()">Stand</button>
  <button onclick="double()">Double</button>

  <div id="game"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Renderizar cartas con estilo
    function renderCard(card) {
      let suitClass = "";
      if (card.suit === "♥") suitClass = "hearts";
      if (card.suit === "♦") suitClass = "diamonds";
      if (card.suit === "♠") suitClass = "spades";
      if (card.suit === "♣") suitClass = "clubs";

      return `<div class="card ${suitClass}">${card.value}${card.suit}</div>`;
    }

    // Apostar
    function placeBet() {
      const amount = parseInt(document.getElementById("bet").value);
      socket.emit("placeBet", amount);
    }

    socket.on("betPlaced", (data) => {
      document.getElementById("chips").innerText = "Fichas: " + data.chips;
    });

    // Iniciar ronda
    function startRound() {
      socket.emit("startRound");
    }

    socket.on("roundStarted", (data) => {
      let gameDiv = document.getElementById("game");
      gameDiv.innerHTML = "";

      let dealerCard = data.dealer[0];
      gameDiv.innerHTML += "<h2>Dealer: " + renderCard(dealerCard) + "</h2>";

      for (let id in data.players) {
        let hand = data.players[id];
        let cardsHTML = hand.map(c => renderCard(c)).join("");
        gameDiv.innerHTML += `<p>Jugador ${id}: ${cardsHTML}</p>`;
      }
    });

    // Hit
    function hit() {
      socket.emit("hit");
    }

    socket.on("cardDealt", (hand) => {
      let cardsHTML = hand.map(c => renderCard(c)).join("");
      document.getElementById("game").innerHTML += `<p>Nueva carta: ${cardsHTML}</p>`;
    });

    // Stand
    function stand() {
      socket.emit("stand");
    }

    socket.on("playerStood", (hand) => {
      let cardsHTML = hand.map(c => renderCard(c)).join("");
      document.getElementById("game").innerHTML += `<p>Te plantaste con: ${cardsHTML}</p>`;
    });

    // Double
    function double() {
      socket.emit("double");
    }

    socket.on("doubleDone", (data) => {
      document.getElementById("chips").innerText = "Fichas: " + data.chips;
      let cardsHTML = data.hand.map(c => renderCard(c)).join("");
      document.getElementById("game").innerHTML += `<p>Doblas apuesta. Mano: ${cardsHTML}</p>`;
    });

    // Dealer termina
    socket.on("dealerFinished", (data) => {
      let cardsHTML = data.dealer.map(c => renderCard(c)).join("");
      document.getElementById("game").innerHTML += `<h2>Dealer final: ${cardsHTML} (Total: ${data.value})</h2>`;
    });

    // Resultado de la ronda
    socket.on("roundResult", (data) => {
      let dealerCards = data.dealer.map(c => renderCard(c)).join("");
      let playerCards = data.hand.map(c => renderCard(c)).join("");

      document.getElementById("chips").innerText = "Fichas: " + data.chips;

      document.getElementById("game").innerHTML += `
        <h3>Resultado:</h3>
        <p>Tu mano: ${playerCards} (Total: ${data.value})</p>
        <p>Dealer: ${dealerCards} (Total: ${data.dealerValue})</p>
        <p><strong>${data.result}</strong></p>
      `;
    });
  </script>
</body>
</html>
